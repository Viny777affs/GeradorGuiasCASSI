
name: Build Windows EXE e publicar Release

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Baixar codigo do repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip show pywebview

      - name: Baixar e validar WebView2
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force runtime
          Invoke-WebRequest `
            -Uri "https://go.microsoft.com/fwlink/p/?LinkId=2124703" `
            -OutFile "runtime\MicrosoftEdgeWebView2Setup.exe"

          $sig = Get-AuthenticodeSignature "runtime\MicrosoftEdgeWebView2Setup.exe"

          if ($sig.Status -ne "Valid" -or
              $sig.SignerCertificate.Subject -notmatch "Microsoft Corporation") {
            throw "Assinatura do instalador WebView2 invalida."
          }

      - name: Gerar executavel
        shell: pwsh
        run: |
          python -m PyInstaller `
            --noconfirm `
            --clean `
            --onefile `
            --windowed `
            --name GeradorGuiasCASSI `
            --add-data "interface.html;." `
            --add-data "runtime\MicrosoftEdgeWebView2Setup.exe;runtime" `
            --collect-all webview `
            --collect-all pythonnet `
            --collect-all clr_loader `
            --hidden-import clr `
            --hidden-import webview.platforms.edgechromium `
            gerar_guias.py

      - name: Preparar pacote para download
        shell: pwsh
        run: |
          $versao = $env:GITHUB_REF_NAME
          if ($versao -eq "main") {
            $versao = "v1.2.1-build.$env:GITHUB_RUN_NUMBER"
          }
          $nome = "GeradorGuiasCASSI-Windows-x64-$versao"

          New-Item -ItemType Directory -Force pacote

          Copy-Item "dist\GeradorGuiasCASSI.exe" "pacote\"
          Copy-Item "README_CLIENTE.txt" "pacote\"

          Compress-Archive `
            -Path "pacote\*" `
            -DestinationPath "$nome.zip" `
            -Force

          $hash = Get-FileHash "$nome.zip" -Algorithm SHA256
          "$($hash.Hash)  $nome.zip" | Set-Content "$nome.zip.sha256"

      - name: Preparar pacote de fontes
        shell: pwsh
        run: |
          $versao = $env:GITHUB_REF_NAME
          if (-not $versao -or $versao -eq "main") {
            $versao = "build-$env:GITHUB_RUN_NUMBER"
          }
          $stage = "fonte-pacote"
          New-Item -ItemType Directory -Force "$stage\.github\workflows" | Out-Null
          Copy-Item "gerar_guias.py" "$stage\"
          Copy-Item "interface.html" "$stage\"
          Copy-Item "requirements.txt" "$stage\"
          Copy-Item "README.md" "$stage\"
          Copy-Item "README_CLIENTE.txt" "$stage\"
          Copy-Item "RELATORIO_TESTES.md" "$stage\"
          Copy-Item ".github\workflows\build-windows.yml" "$stage\.github\workflows\"
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $fonte = "GeradorGuiasCASSI-Fonte-$versao.zip"
          [System.IO.Compression.ZipFile]::CreateFromDirectory((Resolve-Path $stage), (Join-Path (Get-Location) $fonte))

      - name: Guardar pacote compilado e fontes
        uses: actions/upload-artifact@v4
        with:
          name: GeradorGuiasCASSI-Windows-x64
          path: |
            GeradorGuiasCASSI-Windows-x64-*.zip
            GeradorGuiasCASSI-Windows-x64-*.zip.sha256
            GeradorGuiasCASSI-Fonte-*.zip
          if-no-files-found: error

      - name: Publicar Release
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref == 'refs/heads/main' && format('v1.2.1-build.{0}', github.run_number) || github.ref_name }}
          target_commitish: ${{ github.sha }}
          name: ${{ github.ref == 'refs/heads/main' && format('Gerador de Guias CASSI 1.2.1 - Build {0}', github.run_number) || format('Gerador de Guias CASSI {0}', github.ref_name) }}
          make_latest: true
          generate_release_notes: true
          files: |
            GeradorGuiasCASSI-Windows-x64-*.zip
            GeradorGuiasCASSI-Windows-x64-*.zip.sha256
